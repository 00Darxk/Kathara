name: build-matrix


# Reusable "build engine"

on:
  workflow_call:
    inputs:
      version:
        description: 'Kathará version'
        required: true
        type: string
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 7
      sign-rpm:
        description: 'GPG-sign the RPM packages (only true on the release path)'
        required: false
        type: boolean
        default: false
      rpm-signer-runs-on:
        description: 'Runner that holds the RPM signing key'
        required: false
        type: string
        default: self-hosted
    secrets:
      RPM_GPG_PRIVATE_KEY:
        description: 'base64 of the armored RPM package signing key'
        required: false
      RPM_GPG_PASSPHRASE:
        description: 'passphrase of the RPM package signing key'
        required: false

permissions:
  contents: read

jobs:
  pwd:
    name: pwd-macOS-test
    needs: [test]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu, distro: jammy,    arch: amd64, runs-on: [ self-hosted, x64  ] }
          - { os: ubuntu, distro: jammy,    arch: arm64, runs-on: [ self-hosted, ARM64] }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6.0.3
      - name: Build Deb Package
        if: steps.cache-deb.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd scripts/Linux-Deb
          echo $(pwd)
          sed -i -e "s|__KATHARA_VERSION__|${{ inputs.version }}|g" Makefile
          make docker-unsigned_${{ matrix.distro }} OS=${{ matrix.os }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   #v7.0.1
        with:
          name: deb-${{ matrix.distro }}-${{ matrix.arch }}
          path: scripts/Linux-Deb/Output/*${{ matrix.arch }}.deb
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}
